name: CI Native Linux

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      artifact_run_id:
        required: true
        type: string
      archive_name:
        required: true
        type: string
      llvm_cache_key_amd64:
        description: actions/cache key of the pre-fetched LLVM apt packages for amd64 (from ci_prepare.yaml)
        required: true
        type: string
      llvm_cache_key_arm64:
        description: actions/cache key of the pre-fetched LLVM apt packages for arm64 (from ci_prepare.yaml)
        required: true
        type: string
jobs:
  Linux:
    env:
      PSKEL_BUILD_TARGET: base
    strategy:
      matrix:
        runs-on: ['ubuntu-24.04', 'ubuntu-24.04-arm']
        version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        type: ['cli', 'zts']
        distro: ['trixie', 'alpine']
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Download prepared workspace
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/source-archive
      - name: Extract prepared workspace
        env:
          ARCHIVE_NAME: ${{ inputs.archive_name }}
        run: |
          ARCHIVE_PATH="${RUNNER_TEMP}/source-archive/${ARCHIVE_NAME}"
          tar -xzf "${ARCHIVE_PATH}" --strip-components=1 -C "${GITHUB_WORKSPACE}"
          rm -f "${ARCHIVE_PATH}"
      - name: Detect toolchain cache keys
        if: matrix.distro != 'alpine'
        id: toolchain
        env:
          LLVM_CACHE_KEY_AMD64: ${{ inputs.llvm_cache_key_amd64 }}
          LLVM_CACHE_KEY_ARM64: ${{ inputs.llvm_cache_key_arm64 }}
        run: |
          VALGRIND_VERSION="$(sed -n 's/^ARG VALGRIND_VERSION=//p' "Dockerfile" | head -n 1)"
          if test -z "${VALGRIND_VERSION}"; then
            echo "Error: VALGRIND_VERSION not found in Dockerfile." >&2
            exit 1
          fi
          ARCH="$(dpkg --print-architecture)"
          case "${ARCH}" in
            amd64) LLVM_CACHE_KEY="${LLVM_CACHE_KEY_AMD64}";;
            arm64) LLVM_CACHE_KEY="${LLVM_CACHE_KEY_ARM64}";;
            *) echo "Error: no LLVM cache key for architecture ${ARCH}." >&2; exit 1;;
          esac
          if test -z "${LLVM_CACHE_KEY}"; then
            echo "Error: empty LLVM cache key for architecture ${ARCH}." >&2
            exit 1
          fi
          echo "valgrind_version=${VALGRIND_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "arch=${ARCH}" >> "${GITHUB_OUTPUT}"
          echo "llvm_cache_key=${LLVM_CACHE_KEY}" >> "${GITHUB_OUTPUT}"
      - name: Restore Valgrind tarball from cache
        if: matrix.distro != 'alpine'
        uses: actions/cache/restore@v6
        with:
          path: valgrind-${{ steps.toolchain.outputs.valgrind_version }}.tar.bz2
          key: valgrind-tarball-${{ steps.toolchain.outputs.valgrind_version }}
          fail-on-cache-miss: true
      - name: Restore LLVM apt packages from cache
        if: matrix.distro != 'alpine'
        uses: actions/cache/restore@v6
        with:
          path: llvm-debs/${{ matrix.distro }}-${{ steps.toolchain.outputs.arch }}
          key: ${{ steps.toolchain.outputs.llvm_cache_key }}
          fail-on-cache-miss: true
      - name: Pull PHP container image
        id: pull-image
        run: |
          docker pull "php:${{ matrix.version }}-${{ matrix.type }}-${{ matrix.distro }}"
          IMAGE_HASH="$(docker inspect "php:${{ matrix.version }}-${{ matrix.type }}-${{ matrix.distro }}" --format '{{.Id}}' | cut -d: -f2)"
          echo "image_hash=${IMAGE_HASH:0:16}" >> "${GITHUB_OUTPUT}"
      - name: Generate cache key
        id: cache-key
        run: |
          ARCH="$(uname -m)"
          echo "key=php-bins-${{ matrix.version }}-${{ matrix.type }}-${{ matrix.distro }}-${ARCH}-${{ steps.pull-image.outputs.image_hash }}" >> "${GITHUB_OUTPUT}"
      - name: Cache PHP binaries
        uses: actions/cache@v6
        with:
          path: php-cache
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            php-bins-${{ matrix.version }}-${{ matrix.type }}-${{ matrix.distro }}-
      - name: Build container
        run: |
          if test -d "php-cache"; then
            echo "Found cached PHP binaries"
          else
            mkdir -p "php-cache"
          fi
          docker compose build --no-cache --build-arg IMAGE="php" --build-arg TAG="${{ matrix.version }}-${{ matrix.type }}-${{ matrix.distro }}" --build-arg SKIP_VALGRIND="${{ matrix.distro == 'alpine' && '1' || '0' }}"
      - name: Test extension with Bundled PHP
        run: docker compose run --rm -v "$(pwd)/php-cache:/opt/php-cache" -e PHP_CACHE_DIR="/opt/php-cache" -e GITHUB_ACTIONS="true" -e CONTAINER_IMAGE_HASH="${{ steps.pull-image.outputs.image_hash }}" shell pskel test
      - name: Test extension with PHP Debug Build
        if: matrix.version != '8.1'
        run: docker compose run --rm -v "$(pwd)/php-cache:/opt/php-cache" -e PHP_CACHE_DIR="/opt/php-cache" -e GITHUB_ACTIONS="true" -e CONTAINER_IMAGE_HASH="${{ steps.pull-image.outputs.image_hash }}" shell pskel test debug
      - name: Test extension with Valgrind
        if: matrix.distro != 'alpine' && matrix.version != '8.1'
        run: docker compose run --rm -v "$(pwd)/php-cache:/opt/php-cache" -e PHP_CACHE_DIR="/opt/php-cache" -e GITHUB_ACTIONS="true" -e CONTAINER_IMAGE_HASH="${{ steps.pull-image.outputs.image_hash }}" shell pskel test valgrind
      - name: Test extension with LLVM Sanitizer (MemorySanitizer)
        if: matrix.distro != 'alpine' && matrix.version != '8.1'
        run: docker compose run --rm -v "$(pwd)/php-cache:/opt/php-cache" -e PHP_CACHE_DIR="/opt/php-cache" -e GITHUB_ACTIONS="true" -e CONTAINER_IMAGE_HASH="${{ steps.pull-image.outputs.image_hash }}" shell pskel test msan
      - name: Test extension with LLVM Sanitizer (AddressSanitizer)
        if: matrix.distro != 'alpine' && matrix.version != '8.1'
        run: docker compose run --rm -v "$(pwd)/php-cache:/opt/php-cache" -e PHP_CACHE_DIR="/opt/php-cache" -e GITHUB_ACTIONS="true" -e CONTAINER_IMAGE_HASH="${{ steps.pull-image.outputs.image_hash }}" shell pskel test asan
      - name: Test extension with LLVM Sanitizer (UndefinedBehaviorSanitizer)
        if: matrix.distro != 'alpine' && matrix.version != '8.1'
        run: docker compose run --rm -v "$(pwd)/php-cache:/opt/php-cache" -e PHP_CACHE_DIR="/opt/php-cache" -e GITHUB_ACTIONS="true" -e CONTAINER_IMAGE_HASH="${{ steps.pull-image.outputs.image_hash }}" shell pskel test ubsan
