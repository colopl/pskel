name: Release
on:
  push:
    tags:
      - '*'
permissions:
  contents: write
jobs:
  Source:
    runs-on: ubuntu-24.04
    env:
      PSKEL_BUILD_TARGET: base
    outputs:
      extension-name: ${{ steps.metadata.outputs.extension-name }}
      version: ${{ steps.metadata.outputs.version }}
      needs-init: ${{ steps.check.outputs.needs-init }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check if initialization is needed
        id: check
        run: |
          if test -f "ext/.gitkeep" && test "$(cat "ext/.gitkeep")" = "pskel_uninitialized"; then
            echo "needs-init=true" >> "${GITHUB_OUTPUT}"
          else
            echo "needs-init=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Initialize extension with fallback skeleton
        if: steps.check.outputs.needs-init == 'true'
        run: |
          docker compose run -v "$(pwd)/ext:/ext" --rm shell pskel init skeleton
      - name: Upload initialized extension
        if: steps.check.outputs.needs-init == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: initialized-ext-release
          path: ext/
          retention-days: 1
      - name: Verify project is initialized
        run: |
          if ! test -f "composer.json"; then
            echo "Error: composer.json not found, run 'pskel init' before tagging a release." >&2
            exit 1
          fi
      - name: Extract release metadata
        id: metadata
        run: |
          EXT_NAME="$(jq -r '."php-ext"."extension-name" // empty' "composer.json")"
          if test -z "${EXT_NAME}"; then
            echo "Error: php-ext.extension-name not found in composer.json." >&2
            exit 1
          fi
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          echo "extension-name=${EXT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Create source package
        id: source
        env:
          EXT_NAME: ${{ steps.metadata.outputs.extension-name }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          SRC_ARCHIVE_PATH="${RUNNER_TEMP}/php_${EXT_NAME}-${RELEASE_VERSION}-src.tgz"
          git archive --format="tar.gz" --prefix="${EXT_NAME}-${RELEASE_VERSION}/" --output "${SRC_ARCHIVE_PATH}" HEAD
          echo "archive-path=${SRC_ARCHIVE_PATH}" >> "${GITHUB_OUTPUT}"
      - name: Create GitHub release and upload source package
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_ARCHIVE_PATH: ${{ steps.source.outputs.archive-path }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          fi
          gh release upload "${GITHUB_REF_NAME}" "${SRC_ARCHIVE_PATH}" --clobber
  Windows:
    needs: Source
    runs-on: windows-2025
    strategy:
      matrix:
        version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        arch: ['x64', 'x86']
        ts: ['ts', 'nts']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download initialized extension
        if: needs.Source.outputs.needs-init == 'true'
        uses: actions/download-artifact@v8
        with:
          name: initialized-ext-release
          path: ext/
      - name: Stage extension source for Windows builder
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath .\ext -Force | Copy-Item -Destination . -Recurse -Force
      - name: Build extension
        uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --enable-${{ needs.Source.outputs.extension-name }}
  Upload_Windows:
    needs:
      - Source
      - Windows
    runs-on: ubuntu-24.04
    steps:
      - name: Upload Windows binaries to the release
        uses: php/php-windows-builder/release@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          release: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
